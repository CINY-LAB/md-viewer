<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>mdv</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <button id="newBtn" title="새 파일 (Ctrl+N)">새 파일</button>
      <button id="openBtn" title="열기 (Ctrl+O)">열기</button>
      <button id="saveBtn" title="저장 (Ctrl+S)">저장</button>
      <span class="sep"></span>
      <span class="seg" title="보기/편집 전환 (Ctrl+E)">
        <button id="modeView">보기</button><button id="modeEdit">편집</button>
      </span>
      <span class="grow"></span>
      <button id="settingsBtn" title="설정">설정</button>
      <div id="settingsPanel" class="settings-panel" hidden>
        <label>테마
          <select id="setTheme">
            <option value="system">시스템</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
        <label>글꼴 크기
          <select id="setSize">
            <option value="13">13</option><option value="14">14</option><option value="15">15</option>
            <option value="16">16</option><option value="17">17</option><option value="18">18</option>
            <option value="19">19</option><option value="20">20</option>
          </select>
        </label>
        <label class="check"><input id="setWrap" type="checkbox" /> 편집기 줄 바꿈</label>
      </div>
    </header>
    <div id="pathLine" class="pathline"></div>
    <div id="tabs" class="tabs"></div>
    <main class="content">
      <div id="empty" class="empty">위의 "열기"로 파일을 열거나 "새 파일"로 시작함<br />Ctrl+O 열기 · Ctrl+N 새 파일 · Ctrl+E 보기/편집 전환 · Ctrl+S 저장 · Ctrl+W 탭 닫기</div>
      <article id="viewer" class="viewer markdown-body" hidden></article>
      <div id="editor" class="editor" hidden></div>
    </main>
    <div id="status" class="status"></div>
  </body>
</html>
